<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Open-world arcade driving. Steal any car, outrun the cops, wreck everything." />
    <title>Untitled Driving Game</title>
    <!-- the display face (M8.9 R2), fetched with the page; src/ui/fonts.ts registers the three -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/rubik-900i.woff2" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="loading" class="loading"><span class="loading__text">WCZYTYWANIE</span><div class="loading__bar"><div class="loading__fill"></div></div></div>
    <script>
      (function () {
        // the loading screen speaks the game's default language, Polish (DESIGN.md §19); English with ?lang=en
        var english = /[?&]lang=en(&|$)/.test(location.search);
        var text = document.querySelector('#loading .loading__text');
        if (english) {
          document.documentElement.lang = 'en';
          if (text) text.textContent = 'LOADING';
        }
        // the island's bake (M8.10 slice 18) fetched as soon as the game's scripts are in, before they run: the scripts
        // first, the whole line theirs, then the bake while they start (src/app/islandBake.ts takes it up); the island is
        // the game's world but where a page asks for the grid (its map or its spawns) or the playground (src/app/world.ts)
        var q = location.search;
        if (/[?&]map=island(&|$)/.test(q) || !(/[?&]map=(grid|city|playground)(&|$)/.test(q) || /[?&]spawn=/.test(q) && !/[?&]spawn=(island|port|beach|runway|hideout)(&|$)/.test(q) || /[?&]bot=track(&|$)/.test(q))) {
          var bake = function () { if (!window.__islandBin) window.__islandBin = fetch('./island.bin'); };
          var scripts = document.querySelectorAll('link[rel=modulepreload]'), left = scripts.length;
          if (left === 0) bake();
          for (var i = 0; i < scripts.length; i++) scripts[i].addEventListener('load', function () { if (--left === 0) bake(); });
        }
        // M7 slice 7: if the game's own script never ran (a request that failed), offer a retry the player clicks
        setTimeout(function () {
          var g = window.__game, l = document.getElementById('loading');
          if ((g && g.started) || !l || l.classList.contains('is-hidden') || l.classList.contains('is-retry')) return;
          (text || l).textContent = english ? 'STILL LOADING · CLICK TO RETRY' : 'WCIĄŻ WCZYTUJĘ · KLIKNIJ, BY SPRÓBOWAĆ ZNOWU';
          l.classList.add('is-retry');
          l.addEventListener('click', function () { location.reload(); });
        }, 25000);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
