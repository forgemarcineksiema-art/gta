<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Open-world arcade driving. Steal any car, outrun the cops, wreck everything." />
    <title>Untitled Driving Game</title>
    <!-- the display face (M8.9 R2), fetched with the page; src/ui/fonts.ts registers the three -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/rubik-900i.woff2" />
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="loading" class="loading"><span class="loading__text">WCZYTYWANIE</span><div class="loading__bar"><div class="loading__fill"></div></div></div>
    <script>
      (function () {
        // the loading screen speaks the game's default language, Polish (DESIGN.md §19); English with ?lang=en
        var english = /[?&]lang=en(&|$)/.test(location.search);
        var text = document.querySelector('#loading .loading__text');
        if (english) {
          document.documentElement.lang = 'en';
          if (text) text.textContent = 'LOADING';
        }
        // the island's bake (M8.10 slice 18) on its way with the game's scripts, not after them
        if (/[?&]map=island(&|$)/.test(location.search)) {
          var bake = document.createElement('link');
          bake.rel = 'preload';
          bake.as = 'fetch';
          bake.crossOrigin = 'anonymous';
          bake.href = './island.bin';
          document.head.appendChild(bake);
        }
        // M7 slice 7: if the game's own script never ran (a request that failed), offer a retry the player clicks
        setTimeout(function () {
          var g = window.__game, l = document.getElementById('loading');
          if ((g && g.started) || !l || l.classList.contains('is-hidden') || l.classList.contains('is-retry')) return;
          (text || l).textContent = english ? 'STILL LOADING · CLICK TO RETRY' : 'WCIĄŻ WCZYTUJĘ · KLIKNIJ, BY SPRÓBOWAĆ ZNOWU';
          l.classList.add('is-retry');
          l.addEventListener('click', function () { location.reload(); });
        }, 25000);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
